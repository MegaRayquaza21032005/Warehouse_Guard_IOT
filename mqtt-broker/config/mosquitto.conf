# Mosquitto 2.0 — broker MQTT của hệ thống

# ----- Lưu trữ (retained message, session) -----
persistence true
persistence_location /mosquitto/data/

# ----- Log -----
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ----- Listener -----
# MQTT thường (ESP32, Java BE, AI Agent, công cụ dev)
listener 1883
protocol mqtt

# MQTT qua WebSocket (dev)
listener 9001
protocol websockets

# ----- Xác thực: BẮT BUỘC đăng nhập -----
# Tạo / cập nhật file passwd từ .env: ./tools/gen_mqtt_passwd.sh
allow_anonymous false
password_file /mosquitto/config/passwd
