[project]
name = "warehouse-ai-agent"
version = "0.1.0"
description = "AI Agent cho hệ thống giám sát kho: tầng luật + multi-agent Supervisor"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: cần docker compose (PostgreSQL, Mosquitto) đang chạy"]

[tool.ruff]
line-length = 120
target-version = "py312"
